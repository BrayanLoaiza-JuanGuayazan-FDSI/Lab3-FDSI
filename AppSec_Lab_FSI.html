<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AppSec Lab | FSI</title><style>
:root{color-scheme:dark;--bg:#0a1222;--panel:#13243a;--acc:#53c8e9;--border:#294359;--txt:#eaf4ff}*{box-sizing:border-box}body{margin:0;font:15px system-ui;background:var(--bg);color:var(--txt)}header{background:linear-gradient(125deg,#163352,#0d192d);padding:30px max(18px,calc((100vw - 1060px)/2));border-bottom:1px solid var(--border)}h1{margin:6px 0;font-size:32px}h2{font-size:20px}small,p{color:#bacad9}.wrap{max-width:1060px;margin:24px auto;padding:0 18px;display:grid;grid-template-columns:260px 1fr;gap:20px}aside,.panel{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:18px}aside{height:max-content;position:sticky;top:12px}button{cursor:pointer;border:1px solid var(--border);background:#203952;color:white;padding:11px 14px;border-radius:8px;text-align:left}button:hover{border-color:var(--acc)}nav button{display:block;width:100%;margin-bottom:8px}nav button.active{background:#17647b}input,textarea,select{width:100%;background:#0b192a;color:#f4fbff;border:1px solid #456077;border-radius:8px;padding:10px;margin:6px 0 14px}textarea{min-height:90px}label{display:block;font-weight:600}li{margin-bottom:10px}pre{white-space:pre-wrap;word-break:break-word;background:#081422;padding:15px;border-radius:8px;border:1px solid #314a62;color:#a7e8f0}.pill{font-size:12px;color:#90e5fc}.bar{height:8px;background:#2c4558;border-radius:8px}.bar span{display:block;background:#36c8a6;height:100%;border-radius:8px}.actions{display:flex;flex-wrap:wrap;gap:8px}.hidden{display:none}.check{display:flex;align-items:flex-start;gap:9px;padding:10px;background:#182f44;border-radius:8px;margin:10px 0}.check input{width:auto;margin:2px 0}a{color:#76dcf9}@media(max-width:740px){.wrap{grid-template-columns:1fr}aside{position:static}}</style></head><body>
<header><span class="pill">ESCUELA COLOMBIANA DE INGENIERÍA JULIO GARAVITO · FSI</span><h1>AppSec Lab <span style="color:#67d9f4">/ GitHub</span></h1><p>Del repositorio al hallazgo, del hallazgo al Pull Request de remediación.</p></header>
<div class="wrap"><aside><strong>Ruta del laboratorio</strong><p id="progress">0 de 8 etapas completadas</p><div class="bar"><span id="bar" style="width:0%"></span></div><nav id="nav"></nav><div class="actions"><button onclick="exportReport()">Exportar informe .md</button><button onclick="resetLab()">Reiniciar</button></div><small>Los datos se guardan solo en este navegador. No se envían a ningún servidor.</small></aside><main class="panel"><div id="screen"></div></main></div>
<script>
const stages=[
['Alcance y autorización','Define el repositorio, la rama y las restricciones del ejercicio.','Registrar URL del repositorio, commit SHA, propietarios y autorización. Nunca analizar sitios ajenos.'],
['Code scanning','Habilita CodeQL Default setup en GitHub cuando esté disponible.','GitHub → Settings → Advanced Security → CodeQL analysis → Set up → Default. Valida que exista un análisis completado.'],
['SAST + secretos','Ejecuta Semgrep y Gitleaks mediante GitHub Actions.','Copia .github/workflows/seguridad-estatica.yml al repositorio. Abre un Pull Request y consulta Actions y sus artefactos.'],
['SCA / Dependabot','Examina los componentes de terceros y su exposición.','Habilita Dependabot alerts donde esté disponible. Analiza una dependencia e identifica si el código utiliza la función afectada.'],
['DAST pasivo','Evalúa tu staging aislado con ZAP Baseline.','Usa una URL HTTPS propia y autorizada en la variable STAGING_URL. Ejecuta manualmente .github/workflows/dast-staging.yml; descarga artefactos.'],
['Pentest controlado','Confirma una hipótesis sin impacto destructivo.','Usa usuarios de prueba y rutas bajo control. Registra una petición inocua, la respuesta, el riesgo y la conclusión.'],
['Corrección y reescaneo','Resuelve un hallazgo mediante Pull Request.','Registra el commit, agrega prueba de regresión y ejecuta nuevamente la herramienta correspondiente.'],
['Entrega y sustentación','Consolida el informe y explica tus resultados.','Entrega docs/SECURITY.md, docs/REPORTE_HALLAZGOS.md, PR y evidencia antes/después.'] ];
let data;try{data=JSON.parse(localStorage.getItem('fsi-appsec-lab'))||{}}catch{data={}};let selected=0;
function save(){localStorage.setItem('fsi-appsec-lab',JSON.stringify(data))}function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function render(){document.getElementById('nav').innerHTML=stages.map((s,i)=>`<button class="${selected===i?'active':''}" onclick="selected=${i};render()">${data['done'+i]?'✓':'○'} ${i+1}. ${esc(s[0])}</button>`).join('');let n=stages.filter((_,i)=>data['done'+i]).length;document.getElementById('progress').textContent=`${n} de 8 etapas completadas`;document.getElementById('bar').style.width=(n/8*100)+'%';let s=stages[selected];document.getElementById('screen').innerHTML=`<span class="pill">ETAPA ${selected+1} / 8</span><h2>${esc(s[0])}</h2><p>${esc(s[1])}</p><div class="check"><input type="checkbox" id="done" ${data['done'+selected]?'checked':''} onchange="update('done${selected}',this.checked)"><label for="done">Actividad realizada y evidencia disponible</label></div><h3>Acción requerida</h3><p>${esc(s[2])}</p><label>Enlace a evidencia / workflow / Pull Request</label><input id="evidence" value="${esc(data['evidence'+selected])}" oninput="update('evidence${selected}',this.value)" placeholder="https://github.com/... o referencia local"><label>Hallazgo, resultado o limitación</label><textarea id="note" oninput="update('note${selected}',this.value)" placeholder="Explica qué encontraste y cómo lo comprobaste">${esc(data['note'+selected])}</textarea><div class="actions"><button onclick="selected=Math.max(0,selected-1);render()">Anterior</button><button onclick="selected=Math.min(7,selected+1);render()">Siguiente</button></div>${selected===0?'<h3>Inicio</h3><p>Repositorio y rama deben ser tuyos o contar con autorización expresa. No subas claves ni información de usuarios reales.</p>':''}`};function update(k,v){data[k]=v;save();if(k.startsWith('done'))render()}
function exportReport(){let lines=['# Informe de integración AppSec — FSI','','Fecha: '+new Date().toLocaleDateString('es-CO'),''];stages.forEach((s,i)=>{lines.push(`## ${i+1}. ${s[0]}`,`Estado: ${data['done'+i]?'Completado':'Pendiente'}`,`Evidencia: ${data['evidence'+i]||'Pendiente'}`,`Observaciones: ${data['note'+i]||'Pendiente'}`,'')});let blob=new Blob([lines.join('
')],{type:'text/markdown;charset=utf-8'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='informe-appsec-fsi.md';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function resetLab(){if(confirm('¿Borrar el avance local de este navegador?')){data={};save();render()}}render();
</script></body></html>
