<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="860" viewBox="0 0 1500 860" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#222"/>
    </marker>
    <marker id="arrred" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c62828"/>
    </marker>
  </defs>
  <rect width="1500" height="860" fill="#ffffff"/>

  <!-- Zona no confiable -->
  <rect x="30" y="30" width="400" height="380" rx="10" fill="#fafafa" stroke="#222" stroke-width="3"/>
  <text x="45" y="58" font-size="16" font-weight="bold">Zona no confiable (LAN / laboratorio)</text>

  <!-- Analista SOC -->
  <g stroke="#222" stroke-width="2" fill="#eee">
    <circle cx="150" cy="90" r="13"/>
    <line x1="150" y1="103" x2="150" y2="135" fill="none"/>
    <line x1="132" y1="117" x2="168" y2="117"/>
    <line x1="150" y1="135" x2="136" y2="155"/>
    <line x1="150" y1="135" x2="164" y2="155"/>
  </g>
  <text x="150" y="178" font-size="14" text-anchor="middle">Analista SOC (navegador)</text>

  <!-- Kali -->
  <g stroke="#222" stroke-width="2" fill="#eee">
    <circle cx="150" cy="255" r="13"/>
    <line x1="150" y1="268" x2="150" y2="300"/>
    <line x1="132" y1="282" x2="168" y2="282"/>
    <line x1="150" y1="300" x2="136" y2="320"/>
    <line x1="150" y1="300" x2="164" y2="320"/>
  </g>
  <text x="150" y="343" font-size="14" text-anchor="middle">Kali (Red Team)</text>

  <!-- Servidor -->
  <rect x="520" y="30" width="760" height="800" rx="10" fill="#ffffff" stroke="#222" stroke-width="3"/>
  <text x="580" y="56" font-size="16" font-weight="bold">Servidor Ubuntu (host autorizado)</text>

  <!-- UFW -->
  <rect x="528" y="70" width="34" height="710" fill="#fff3cd" stroke="#b58900" stroke-width="2"/>
  <text transform="rotate(-90 545 545)" x="545" y="550" font-size="13" text-anchor="middle" fill="#7a5c00">UFW: deny incoming · allow 80/tcp desde LAB_CIDR · SSH (LÍMITE 1)</text>

  <!-- Nginx -->
  <rect x="600" y="140" width="320" height="120" fill="#f4f4f4" stroke="#222" stroke-width="2"/>
  <text x="615" y="168" font-size="15" font-weight="bold">Nginx :80 (reverse proxy)</text>
  <text x="615" y="192" font-size="13">server_tokens off · headers defensivos</text>
  <text x="615" y="212" font-size="13">autoindex off · deny rutas ocultas</text>
  <text x="615" y="232" font-size="13" fill="#7a5c00">HTTP sin TLS (riesgo abierto)</text>

  <!-- Loopback -->
  <rect x="590" y="300" width="670" height="360" rx="8" fill="#f1f8f1" stroke="#2e7d32" stroke-width="2" stroke-dasharray="8,6"/>
  <text x="1222" y="322" font-size="13" text-anchor="end" fill="#2e7d32" font-weight="bold">LÍMITE 2 — solo loopback (127.0.0.1)</text>

  <!-- Alerts API -->
  <rect x="620" y="350" width="300" height="100" fill="#f4f4f4" stroke="#222" stroke-width="2"/>
  <text x="635" y="378" font-size="15" font-weight="bold">Alerts API 127.0.0.1:5000</text>
  <text x="635" y="402" font-size="13">Flask · debug=False</text>
  <text x="635" y="422" font-size="13">sin endpoint /debug/env</text>
  <!-- ALERTS store -->
  <g stroke="#222" stroke-width="2" fill="#f4f4f4">
    <path d="M1000,372 L1000,428 A70,14 0 0 0 1140,428 L1140,372"/>
    <ellipse cx="1070" cy="372" rx="70" ry="14"/>
  </g>
  <text x="1070" y="405" font-size="14" text-anchor="middle">ALERTS</text>
  <text x="1070" y="422" font-size="12" text-anchor="middle">(memoria)</text>
  <line x1="920" y1="400" x2="1000" y2="400" stroke="#222" stroke-width="2" marker-start="url(#arr)" marker-end="url(#arr)"/>

  <!-- Actions API -->
  <rect x="620" y="540" width="300" height="100" fill="#f4f4f4" stroke="#222" stroke-width="2"/>
  <text x="635" y="568" font-size="15" font-weight="bold">Actions API 127.0.0.1:5001</text>
  <text x="635" y="592" font-size="13">Flask · debug=False</text>
  <text x="635" y="612" font-size="13">registra source_ip (X-Real-IP)</text>
  <!-- ACTIONS store -->
  <g stroke="#222" stroke-width="2" fill="#f4f4f4">
    <path d="M1000,562 L1000,618 A70,14 0 0 0 1140,618 L1140,562"/>
    <ellipse cx="1070" cy="562" rx="70" ry="14"/>
  </g>
  <text x="1070" y="595" font-size="14" text-anchor="middle">ACTIONS</text>
  <text x="1070" y="612" font-size="12" text-anchor="middle">(memoria)</text>
  <line x1="920" y1="590" x2="1000" y2="590" stroke="#222" stroke-width="2" marker-start="url(#arr)" marker-end="url(#arr)"/>

  <!-- Logs -->
  <rect x="620" y="700" width="620" height="64" fill="#f4f4f4" stroke="#222" stroke-width="2"/>
  <text x="635" y="726" font-size="14" font-weight="bold">Logs (punto de generación)</text>
  <text x="635" y="746" font-size="13">lab3_access.log · lab3_error.log (Nginx) · alerts.log · actions.log (con source_ip)</text>

  <!-- Blue Team -->
  <g stroke="#222" stroke-width="2" fill="#eee">
    <circle cx="1390" cy="690" r="13"/>
    <line x1="1390" y1="703" x2="1390" y2="735"/>
    <line x1="1372" y1="717" x2="1408" y2="717"/>
    <line x1="1390" y1="735" x2="1376" y2="755"/>
    <line x1="1390" y1="735" x2="1404" y2="755"/>
  </g>
  <text x="1390" y="780" font-size="14" text-anchor="middle">Blue Team</text>
  <line x1="1240" y1="732" x2="1350" y2="732" stroke="#222" stroke-width="2" stroke-dasharray="7,5" marker-end="url(#arr)"/>
  <text x="1298" y="718" font-size="12" text-anchor="middle">telemetría</text>

  <!-- Flujos -->
  <line x1="232" y1="118" x2="598" y2="196" stroke="#222" stroke-width="2" marker-end="url(#arr)"/>
  <text x="250" y="106" font-size="13">HTTP GET / (dashboard)</text>
  <line x1="232" y1="262" x2="598" y2="238" stroke="#222" stroke-width="2" marker-end="url(#arr)"/>
  <text x="250" y="236" font-size="13">HTTP · nmap · curl · ZAP</text>

  <!-- Acceso directo bloqueado -->
  <line x1="232" y1="305" x2="512" y2="425" stroke="#c62828" stroke-width="2" stroke-dasharray="7,5" marker-end="url(#arrred)"/>
  <g stroke="#c62828" stroke-width="4">
    <line x1="506" y1="414" x2="526" y2="434"/>
    <line x1="526" y1="414" x2="506" y2="434"/>
  </g>
  <text x="240" y="282" font-size="13" fill="#c62828" font-weight="bold">acceso directo :5000 / :5001</text>
  <text x="240" y="299" font-size="13" fill="#c62828">bloqueado (UFW + bind local)</text>

  <!-- Nginx -> APIs -->
  <line x1="700" y1="260" x2="700" y2="348" stroke="#222" stroke-width="2" marker-end="url(#arr)"/>
  <text x="712" y="312" font-size="12">proxy_pass /api/alerts/ → :5000</text>
  <path d="M606,260 L606,590 L618,590" fill="none" stroke="#222" stroke-width="2" marker-end="url(#arr)"/>
  <text x="628" y="500" font-size="12">proxy_pass /api/actions/ → :5001</text>

  <!-- Insignias de mejora -->
  <g font-size="13" font-weight="bold" fill="#fff" text-anchor="middle">
    <circle cx="1235" cy="308" r="11" fill="#2e7d32"/><text x="1235" y="313">1</text>
    <circle cx="545" cy="90" r="11" fill="#b58900"/><text x="545" y="95">2</text>
    <circle cx="935" cy="360" r="11" fill="#2e7d32"/><text x="935" y="365">3</text>
    <circle cx="935" cy="150" r="11" fill="#2e7d32"/><text x="935" y="155">4</text>
    <circle cx="935" cy="550" r="11" fill="#2e7d32"/><text x="935" y="555">5</text>
  </g>

  <!-- Leyenda -->
  <rect x="30" y="440" width="460" height="390" rx="10" fill="#f1f8f1" stroke="#2e7d32" stroke-width="2"/>
  <text x="45" y="468" font-size="15" font-weight="bold">Mejoras respecto a la arquitectura inicial</text>
  <g font-size="13">
    <text x="45" y="498"><tspan font-weight="bold" fill="#2e7d32">1</tspan>  Flask solo en 127.0.0.1: la frontera L2</text>
    <text x="63" y="516">pasa a cumplirse (antes 0.0.0.0:5000/5001)</text>
    <text x="45" y="544"><tspan font-weight="bold" fill="#b58900">2</tspan>  UFW: solo 80/tcp desde LAB_CIDR + SSH</text>
    <text x="45" y="572"><tspan font-weight="bold" fill="#2e7d32">3</tspan>  Sin /debug/env y sin debug=True</text>
    <text x="45" y="600"><tspan font-weight="bold" fill="#2e7d32">4</tspan>  Nginx: server_tokens off, headers, autoindex</text>
    <text x="63" y="618">off, deny de rutas ocultas</text>
    <text x="45" y="646"><tspan font-weight="bold" fill="#2e7d32">5</tspan>  Acciones con source_ip (X-Real-IP) para</text>
    <text x="63" y="664">correlacionar con access.log</text>
  </g>
  <line x1="45" y1="684" x2="475" y2="684" stroke="#2e7d32" stroke-width="1"/>
  <text x="45" y="710" font-size="15" font-weight="bold" fill="#7a5c00">Riesgos abiertos</text>
  <text x="45" y="734" font-size="13" fill="#7a5c00">TLS (HTTP sigue sin confidencialidad ni integridad)</text>
  <text x="45" y="754" font-size="13" fill="#7a5c00">Autenticación / RBAC (identidad)</text>
  <text x="45" y="774" font-size="13" fill="#7a5c00">Rate limiting y servidor WSGI de producción</text>
</svg>
